<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project Information</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f4e79;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search-box {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .project {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .project h2 {
      margin-top: 0;
      color: #1f4e79;
    }

    .detail {
      margin: 10px 0;
      line-height: 1.5;
    }

    .label {
      font-weight: bold;
    }

    #message {
      text-align: center;
      color: #666;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Project Information</h1>
    <p>Search for a project or keyword</p>
  </header>

  <div class="container">

    <input
      type="text"
      id="search"
      class="search-box"
      placeholder="Search project name, location, contractor, etc."
    >

    <div id="results">
      <div id="message">Loading projects...</div>
    </div>

  </div>

  <script>

    let projects = [];

    fetch("projects.json")
      .then(response => response.json())
      .then(data => {
        projects = data;
        displayProjects(projects);
      })
      .catch(error => {
        document.getElementById("message").textContent =
          "Project information is currently unavailable.";
      });

    function displayProjects(list) {

      const results = document.getElementById("results");

      if (list.length === 0) {
        results.innerHTML =
          '<div id="message">No matching project found.</div>';
        return;
      }

      results.innerHTML = list.map(project => `

        <div class="project">

          <h2>${project.project_name || ""}</h2>

          <div class="detail">
            <span class="label">Location:</span>
            ${project.location || ""}
          </div>

          <div class="detail">
            <span class="label">Contract Amount:</span>
            ${project.contract_amount || ""}
          </div>

          <div class="detail">
            <span class="label">Source of Fund:</span>
            ${project.source_of_fund || ""}
          </div>

          <div class="detail">
            <span class="label">Contractor:</span>
            ${project.contractor || ""}
          </div>

          <div class="detail">
            <span class="label">Physical Status:</span>
            ${project.physical_status || ""}
          </div>

          <div class="detail">
            <span class="label">Plan Status:</span>
            ${project.plan_status || ""}
          </div>

          <div class="detail">
            <span class="label">Slippage:</span>
            ${project.slippage || ""}
          </div>

          <div class="detail">
            <span class="label">Financial Status:</span>
            ${project.financial_status || ""}
          </div>

          <div class="detail">
            <span class="label">Remarks:</span>
            ${project.remarks || ""}
          </div>

        </div>

      `).join("");
    }

    document.getElementById("search").addEventListener("input", function() {

      const keyword = this.value.toLowerCase();

      const filtered = projects.filter(project =>
        Object.values(project).some(value =>
          String(value).toLowerCase().includes(keyword)
        )
      );

      displayProjects(filtered);

    });

  </script>

</body>
</html>
